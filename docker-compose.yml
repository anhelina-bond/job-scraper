# services:
#   db:
#     image: postgres:16             # Use version 16 of Postgres
#     container_name: job_agent_db    # The name of this "virtual computer"
#     restart: always                 # If it crashes, restart it
#     environment:
#       POSTGRES_USER: user           # Your database username
#       POSTGRES_PASSWORD: password      # Your database password
#       POSTGRES_DB: job_agent        # The name of the database inside
#     ports:
#       - "5432:5432"                 # Connect your PC's port 5432 to Docker's 5432
#     volumes:
#       - postgres_data:/var/lib/postgresql/data  # Keep data even if container stops

# volumes:
#   postgres_data:                    # Reserve space on your hard drive


services:
  db:
    image: postgres:16
    container_name: job_agent_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: job_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: job_agent_backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/job_agent
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_db:/app/chroma_db

  frontend:
    build: ./frontend
    container_name: job_agent_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data: